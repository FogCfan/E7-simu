; Généré par e7twin.npu.vela_ini() à partir de board/ensemble_e7.yaml. Ne pas éditer à la main.
; Valeurs non sourcées = hypothèses : voir docs/NPU.md et e7twin.npu.ASSUMPTIONS.

; ethos-u55-256 associé à m55_hp ; SRAM (AXI0) + MRAM lecture seule (AXI1)
[System_Config.E7_U55_256_MRAM]
core_clock=400000000
axi0_port=Sram
axi1_port=OnChipFlash
Sram_clock_scale=1.0
Sram_burst_length=32
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=4
Sram_max_writes=4
OnChipFlash_clock_scale=0.25
OnChipFlash_burst_length=128
OnChipFlash_read_latency=64
OnChipFlash_write_latency=0
OnChipFlash_max_reads=2
OnChipFlash_max_writes=0

; ethos-u55-128 associé à m55_he ; SRAM (AXI0) + MRAM lecture seule (AXI1)
[System_Config.E7_U55_128_MRAM]
core_clock=160000000
axi0_port=Sram
axi1_port=OnChipFlash
Sram_clock_scale=1.0
Sram_burst_length=32
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=4
Sram_max_writes=4
OnChipFlash_clock_scale=0.25
OnChipFlash_burst_length=128
OnChipFlash_read_latency=64
OnChipFlash_write_latency=0
OnChipFlash_max_reads=2
OnChipFlash_max_writes=0

; Poids en lecture seule (MRAM/OSPI, Axi1) ; arena et entrées/sorties en SRAM (Axi0).
[Memory_Mode.E7_Shared_Sram]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0
