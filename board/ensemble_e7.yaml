     source: "he_soc L3228, L137"}

  # --- NPU Ethos-U55 (fenêtre locale de chaque M55) ---
  - {name: npu_hp, type: ethos-u55, base: 0x400E1000, size: 0x1000, irq: {m55_hp: 55}, visible_to: [m55_hp], local: true, macs: 256,
     source: "hp_soc L3236 NPU_HP_BASE, L138 IRQ, L1453 NPU_HP_Type 0x1000 ; pdsc L1779"}
  - {name: npu_he, type: ethos-u55, base: 0x400E1000, size: 0x1000, irq: {m55_he: 55}, visible_to: [m55_he], local: true, macs: 128,
     source: "he_soc L3231 NPU_HE_BASE, L149 IRQ ; pdsc L1780"}

  # --- Architectural Cortex-M55 (par cœur) : SCS/NVIC/SysTick et DWT ---
